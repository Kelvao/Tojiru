<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tojiru 綴じる</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        const SCRIPT_CHECKS = [
          ["src/domain/library.js", "domain"],
          ["src/presentation/i18n.js", "i18n"],
          ["src/application/usecases.js", "usecases"],
          ["src/infrastructure/xml.js", "infra.xml"],
          ["src/infrastructure/browser.js", "infra.browser"],
          ["src/infrastructure/imagesize.js", "infra.imagesize"],
          ["src/infrastructure/images.js", "infra.images"],
          ["src/infrastructure/cbz.js", "infra.cbz"],
          ["src/infrastructure/epub.js", "infra.epub"],
          ["src/presentation/view.js", "ui.createView"],
          ["src/presentation/controller.js", "ui.createController"],
          ["src/main.js", "started"],
        ];
        const problems = [];
        let hasLocalProblem = false;

        function render() {
          let box = document.getElementById("startup-problems");
          if (!box) {
            box = document.createElement("div");
            box.id = "startup-problems";
            box.setAttribute(
              "style",
              "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:12px 16px;border-radius:12px;background:#36363a;color:#fff;font:14px/1.5 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.6);white-space:pre-wrap",
            );
            (document.body || document.documentElement).append(box);
          }
          const hint = hasLocalProblem
            ? "\nMantenha as pastas css/ e src/ ao lado do index.html, com a estrutura original. / Keep the css/ and src/ folders next to index.html, with their original structure."
            : "";
          box.textContent = "Problema ao carregar / Loading problem:\n- " + problems.join("\n- ") + hint;
        }

        function report(message, isLocal = true) {
          if (isLocal) hasLocalProblem = true;
          if (!problems.includes(message)) problems.push(message);
          render();
        }

        window.addEventListener(
          "error",
          (event) => {
            const source = event.target && (event.target.src || event.target.href);
            if (source) {
              if (source.includes("jszip")) report("JSZip local não carregou / Local JSZip failed to load", false);
              else report("Falha ao carregar / Failed to load: " + source);
              return;
            }
            report(
              event.message + (event.filename ? " (" + event.filename.split("/").pop() + ":" + event.lineno + ")" : ""),
            );
          },
          true,
        );

        window.addEventListener("load", () => {
          const stylesApplied = getComputedStyle(document.documentElement).getPropertyValue("--win").trim();
          if (!stylesApplied) report("css/style.css não aplicado / not applied");
          SCRIPT_CHECKS.forEach(([file, path]) => {
            const loaded = path.split(".").reduce((scope, key) => (scope ? scope[key] : undefined), window.Tojiru);
            if (!loaded) report(file + " não carregou / did not load");
          });
        });
      })();
    </script>
  </head>
  <body>
    <div class="hb">
      <a
        class="gh"
        href="https://github.com/Kelvao/Tojiru"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n-aria-label="link.github"
      >
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        <span>GitHub</span>
      </a>
      <div class="wt"><b>Tojiru</b><span lang="ja">綴じる</span></div>
      <button class="flat lang" id="langToggle" data-i18n-aria-label="lang.change">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z" />
        </svg>
        <span id="langCode"></span>
      </button>
    </div>
    <main>
      <div class="layout">
        <div class="rail">
          <div class="rail-a">
            <section class="hero">
              <div class="ico" lang="ja" aria-hidden="true">綴</div>
              <h1>Tojiru</h1>
              <p data-i18n="hero.description"></p>
              <p class="sub" data-i18n="hero.privacy"></p>
            </section>

            <section class="grp">
              <div class="gt"><h2 data-i18n="section.folder"></h2></div>
              <label class="drop">
                <span class="ic" aria-hidden="true"
                  ><svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg
                ></span>
                <span class="tx"><b data-i18n="folder.choose"></b><span id="st"></span></span>
                <svg
                  class="chev"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 6l6 6-6 6" />
                </svg>
                <input id="dir" type="file" webkitdirectory directory multiple />
              </label>
            </section>
          </div>
          <div class="rail-b">
            <section class="grp">
              <div class="gt"><h2 data-i18n="section.details"></h2></div>
              <div class="card">
                <div class="er" data-field="series">
                  <div class="er-head">
                    <label for="series" data-i18n="field.title"></label><span class="tag"></span>
                  </div>
                  <input id="series" aria-describedby="hint-series" data-i18n-placeholder="placeholder.series" />
                  <div class="hint" id="hint-series" data-i18n="hint.series"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="writer">
                  <div class="er-head">
                    <label for="writer" data-i18n="field.author"></label><span class="tag"></span>
                  </div>
                  <input id="writer" aria-describedby="hint-writer" data-i18n-placeholder="placeholder.writer" />
                  <div class="hint" id="hint-writer" data-i18n="hint.writer"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="penciller">
                  <div class="er-head">
                    <label for="penciller" data-i18n="field.artist"></label><span class="tag"></span>
                  </div>
                  <input
                    id="penciller"
                    aria-describedby="hint-penciller"
                    data-i18n-placeholder="placeholder.penciller"
                  />
                  <div class="hint" id="hint-penciller" data-i18n="hint.penciller"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="genres">
                  <div class="er-head">
                    <label for="genre" data-i18n="field.genres"></label><span class="tag"></span>
                  </div>
                  <input id="genre" aria-describedby="hint-genres" data-i18n-placeholder="placeholder.genres" />
                  <div class="hint" id="hint-genres" data-i18n="hint.genres"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="publisher">
                  <div class="er-head">
                    <label for="publisher" data-i18n="field.publisher"></label><span class="tag"></span>
                  </div>
                  <input
                    id="publisher"
                    aria-describedby="hint-publisher"
                    data-i18n-placeholder="placeholder.publisher"
                  />
                  <div class="hint" id="hint-publisher" data-i18n="hint.publisher"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="year">
                  <div class="er-head"><label for="year" data-i18n="field.year"></label><span class="tag"></span></div>
                  <input
                    id="year"
                    type="number"
                    aria-describedby="hint-year"
                    data-i18n-placeholder="placeholder.year"
                  />
                  <div class="hint" id="hint-year" data-i18n="hint.year"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="language">
                  <div class="er-head">
                    <label for="lang" data-i18n="field.language"></label><span class="tag"></span>
                  </div>
                  <input
                    id="lang"
                    list="langList"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="hint-language"
                    data-i18n-placeholder="placeholder.language"
                  />
                  <datalist id="langList"></datalist>
                  <div class="hint" id="hint-language" data-i18n="hint.language"></div>
                  <div class="field-error" role="alert" data-i18n="error.language"></div>
                </div>
                <div class="er" data-field="volume">
                  <div class="er-head">
                    <label for="volume" data-i18n="field.volume"></label><span class="tag"></span>
                  </div>
                  <input
                    id="volume"
                    type="number"
                    aria-describedby="hint-volume"
                    data-i18n-placeholder="placeholder.volume"
                  />
                  <div class="hint" id="hint-volume" data-i18n="hint.volume"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="readingMode">
                  <div class="er-head">
                    <label for="manga" data-i18n="field.reading"></label><span class="tag"></span>
                  </div>
                  <select id="manga" aria-describedby="hint-readingMode">
                    <option value="YesAndRightToLeft" data-i18n="reading.rtl"></option>
                    <option value="Yes" data-i18n="reading.ltr"></option>
                    <option value="No" data-i18n="reading.none"></option>
                  </select>
                  <div class="hint" id="hint-readingMode" data-i18n="hint.readingMode"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
                <div class="er" data-field="summary">
                  <div class="er-head">
                    <label for="summary" data-i18n="field.summary"></label><span class="tag"></span>
                  </div>
                  <textarea
                    id="summary"
                    aria-describedby="hint-summary"
                    data-i18n-placeholder="placeholder.summary"
                  ></textarea>
                  <div class="hint" id="hint-summary" data-i18n="hint.summary"></div>
                  <div class="field-error" role="alert" data-i18n="error.required"></div>
                </div>
              </div>
            </section>
          </div>
        </div>

        <section class="grp col-index">
          <div class="gt"><h2 data-i18n="section.index"></h2></div>
          <div class="tools">
            <button class="pri" id="add" disabled data-i18n="action.newItem"></button>
            <div class="tg" role="group" aria-labelledby="tl-fill">
              <div class="tl" id="tl-fill" data-i18n="section.autoFill"></div>
              <div class="row">
                <button id="extract" disabled data-i18n="action.extractFolders"></button>
                <button id="auto" disabled data-i18n="action.numberChapters"></button>
                <button class="dng" id="clear" disabled data-i18n="action.clearNames"></button>
              </div>
            </div>
          </div>
          <div class="card"><div id="list"></div></div>
        </section>

        <div class="bar">
          <div class="info">
            <div id="sum"></div>
            <progress id="pr" class="hide" max="100" value="0"></progress>
            <div id="st2"></div>
          </div>
          <div class="row">
            <div class="seg" role="radiogroup" data-i18n-aria-label="format.label">
              <button type="button" role="radio" data-format="cbz" aria-checked="true">CBZ</button>
              <button type="button" role="radio" data-format="epub" aria-checked="false">EPUB</button>
            </div>
            <button id="xml" disabled></button>
            <button class="pri" id="go" disabled></button>
          </div>
        </div>
      </div>
      <dialog id="picker">
        <div class="dlg">
          <div class="dhb">
            <button id="pickCancel" data-i18n="action.cancel"></button>
            <div class="wt"><b data-i18n="picker.title"></b><span id="pickCount"></span></div>
            <button class="pri" id="pickOk" disabled data-i18n="action.create"></button>
          </div>
          <div class="dbody">
            <div class="card">
              <div class="er">
                <div class="er-head">
                  <label for="pickName" data-i18n="picker.name"></label
                  ><span class="tag" data-i18n="field.optional"></span>
                </div>
                <input id="pickName" aria-describedby="hint-pickName" data-i18n-placeholder="picker.namePlaceholder" />
                <div class="hint" id="hint-pickName" data-i18n="picker.nameHint"></div>
              </div>
              <div class="er">
                <label for="pickKind" data-i18n="picker.kind"></label
                ><select id="pickKind"></select>
              </div>
            </div>
            <div id="pickPages"></div>
          </div>
        </div>
      </dialog>
    </main>

    <script src="vendor/jszip.min.js"></script>
    <script src="src/domain/library.js"></script>
    <script src="src/presentation/i18n.js"></script>
    <script src="src/application/usecases.js"></script>
    <script src="src/infrastructure/xml.js"></script>
    <script src="src/infrastructure/browser.js"></script>
    <script src="src/infrastructure/imagesize.js"></script>
    <script src="src/infrastructure/images.js"></script>
    <script src="src/infrastructure/zipstream.js"></script>
    <script src="src/infrastructure/cbz.js"></script>
    <script src="src/infrastructure/epub.js"></script>
    <script src="src/presentation/view.js"></script>
    <script src="src/presentation/controller.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
