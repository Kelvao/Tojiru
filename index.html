<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tojiru 綴じる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hb">
<div class="wt"><b>Tojiru</b><span lang="ja">綴じる</span></div>
<button class="flat lang" id="langToggle" data-i18n-aria-label="lang.change">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg>
<span id="langCode"></span>
</button>
</div>
<main>
<section class="hero">
<div class="ico" lang="ja" aria-hidden="true">綴</div>
<h1>Tojiru</h1>
<p data-i18n="hero.description"></p>
<p class="sub" data-i18n="hero.privacy"></p>
</section>

<section class="grp">
<div class="gt"><h2 data-i18n="section.folder"></h2></div>
<label class="drop">
<span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
<span class="tx"><b data-i18n="folder.choose"></b><span id="st"></span></span>
<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
<input id="dir" type="file" webkitdirectory directory multiple>
</label>
</section>

<section class="grp">
<div class="gt"><h2 data-i18n="section.details"></h2></div>
<div class="card">
<div class="er"><label for="series" data-i18n="field.title"></label><input id="series"></div>
<div class="er"><label for="writer" data-i18n="field.author"></label><input id="writer"></div>
<div class="er"><label for="penciller" data-i18n="field.artist"></label><input id="penciller"></div>
<div class="er"><label for="genre" data-i18n="field.genres"></label><input id="genre"></div>
<div class="er"><label for="publisher" data-i18n="field.publisher"></label><input id="publisher"></div>
<div class="er"><label for="year" data-i18n="field.year"></label><input id="year" type="number"></div>
<div class="er"><label for="lang" data-i18n="field.language"></label><input id="lang"></div>
<div class="er"><label for="volume" data-i18n="field.volume"></label><input id="volume" type="number"></div>
<div class="er"><label for="manga" data-i18n="field.reading"></label>
<select id="manga">
<option value="YesAndRightToLeft" data-i18n="reading.rtl"></option>
<option value="Yes" data-i18n="reading.ltr"></option>
<option value="No" data-i18n="reading.none"></option>
</select></div>
<div class="er"><label for="summary" data-i18n="field.summary"></label><textarea id="summary"></textarea></div>
</div>
</section>

<section class="grp">
<div class="gt">
<h2 data-i18n="section.index"></h2>
<div class="row">
<button id="add" disabled data-i18n="action.newItem"></button>
<button id="auto" data-i18n="action.numberChapters"></button>
<button id="clear" data-i18n="action.clearNames"></button>
</div>
</div>
<div class="card"><div id="list"></div></div>
</section>

<div class="bar">
<div class="info">
<div id="sum"></div>
<progress id="pr" class="hide" max="100" value="0"></progress>
<div id="st2"></div>
</div>
<div class="row">
<button id="xml" disabled data-i18n="action.downloadXml"></button>
<button class="pri" id="go" disabled data-i18n="action.generate"></button>
</div>
</div>
<dialog id="picker">
<div class="dlg">
<div class="dhb">
<button id="pickCancel" data-i18n="action.cancel"></button>
<div class="wt"><b data-i18n="picker.title"></b><span id="pickCount"></span></div>
<button class="pri" id="pickOk" disabled data-i18n="action.create"></button>
</div>
<div class="dbody">
<div class="card">
<div class="er"><label for="pickName" data-i18n="picker.name"></label><input id="pickName" data-i18n-placeholder="picker.namePlaceholder"></div>
<div class="er"><label for="pickKind" data-i18n="picker.kind"></label><select id="pickKind"></select></div>
</div>
<div id="pickPages"></div>
</div>
</div>
</dialog>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
